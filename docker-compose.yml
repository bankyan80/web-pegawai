services:
  app:
    build: .
    container_name: pegawai_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./nodejs/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_ROOT: /app/public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/?hal=home"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
