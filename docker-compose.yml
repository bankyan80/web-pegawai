services:
  db:
    image: mysql:8.0
    container_name: pegawai_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dbtechmuda42
      MYSQL_USER: pegawai
      MYSQL_PASSWORD: pegawai123
    volumes:
      - db_data:/var/lib/mysql
      # import otomatis skema + data awal (hanya saat database pertama kali dibuat)
      - ./dbtechmuda42.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: pegawai_web
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      DB_HOST: db
      DB_NAME: dbtechmuda42
      DB_USER: pegawai
      DB_PASS: pegawai123
      SESSION_SECRET: rahasia-sesi-untuk-development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # source ter-mount langsung => edit file langsung terlihat tanpa rebuild
      - ./nodejs:/app
      - ./css:/app/css
      - ./js:/app/js
      - ./images:/app/images
      - ./fontawesome:/app/fontawesome
    working_dir: /app
    command: sh -c "npm install && node app.js"

volumes:
  db_data:
